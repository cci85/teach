<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>教學工具箱</title>
<style>
  :root{
    --bg:#f5f3ee; --surface:#ffffff; --border:#ddd7c9;
    --ink:#232019; --ink-soft:#655e4d; --ink-faint:#8f886f;
    --accent:#28594f; --accent-strong:#1b4139; --accent-soft:#e1ece7;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141612; --surface:#1c1f1a; --border:#373d33;
      --ink:#eae7dc; --ink-soft:#b7b3a1; --ink-faint:#847e69;
      --accent:#79bda7; --accent-strong:#9bd2bf; --accent-soft:#213b34;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141612; --surface:#1c1f1a; --border:#373d33;
    --ink:#eae7dc; --ink-soft:#b7b3a1; --ink-faint:#847e69;
    --accent:#79bda7; --accent-strong:#9bd2bf; --accent-soft:#213b34;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
  header.top{max-width:1600px;margin:0 auto;padding:16px 16px 8px}
  header.top h1{margin:0;font-size:20px}
  header.top p{margin:2px 0 0;color:var(--ink-soft);font-size:13px}
  .layout{max-width:1600px;margin:0 auto;padding:4px 16px 16px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:14px;align-items:start}
  #toc{position:sticky;top:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px}
  #toc details{margin:2px 0}
  #toc summary{cursor:pointer;font-weight:700;font-size:14.5px;padding:6px 8px;border-radius:8px}
  #toc summary:hover{background:var(--bg)}
  #toc button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:inherit;font-size:14px;padding:6px 8px 6px 22px;border-radius:8px;cursor:pointer}
  #toc button:hover{background:var(--bg)}
  #toc button.on{background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
  .work{display:flex;flex-direction:column;gap:10px;min-width:0}
  #sechead{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px}
  #secinfo{flex:1 1 320px;min-width:0}
  /* 工具頁（iframe）可透過 postMessage 在標題列右側放一列操作按鈕，例如測驗格式轉換的挑題列 */
  #toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  #toolbar[hidden]{display:none}
  #toolbar .lbl{font-size:14.5px;font-weight:600;margin-right:4px}
  #toolbar .lbl b{color:var(--accent);font-family:var(--mono);font-variant-numeric:tabular-nums}
  #toolbar button{border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:5px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:13.5px}
  #toolbar button:hover{border-color:var(--accent);color:var(--accent-strong)}
  #sechead h2{margin:0;font-size:18px}
  #sechead p{margin:2px 0 0;color:var(--ink-soft);font-size:13.5px}
  ol.steps{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  ol.steps li{display:flex;align-items:center;gap:6px}
  ol.steps li+li::before{content:"→";color:var(--ink-faint)}
  ol.steps button{border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px}
  ol.steps button b{font-family:var(--mono);margin-right:6px}
  ol.steps button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  p.stepnote{margin:10px 0 0;padding:8px 12px;border-left:3px solid var(--accent);background:var(--bg);border-radius:0 8px 8px 0;font-size:14px;color:var(--ink)}
  p.extlinks{display:flex;flex-wrap:wrap;gap:8px}
  a.extlink{display:inline-block;margin-top:10px;background:var(--accent);color:#fff;text-decoration:none;padding:8px 16px;border-radius:8px;font-size:14.5px;font-weight:600}
  a.extlink:hover{background:var(--accent-strong)}
  iframe#view[hidden]{display:none}
  iframe#view{width:100%;height:calc(100vh - 120px);min-height:520px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
  footer{max-width:1600px;margin:0 auto;padding:0 16px 20px;color:var(--ink-faint);font-size:12.5px}
  /* 網站更新提示（與「論到你了」相同） */
  .newver{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;background:#fbf0dc;color:#9a5b00;border-bottom:1px solid #9a5b00;font-weight:600}
  .newver[hidden]{display:none}
  .newver button{padding:5px 12px;border:1px solid #9a5b00;border-radius:8px;background:#9a5b00;color:#fff;font:inherit;cursor:pointer}
  .newver small{font-weight:400}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .newver{background:#3a2f1c;color:#e7b360;border-color:#e7b360}
    :root:not([data-theme="light"]) .newver button{background:#e7b360;border-color:#e7b360;color:#141612}
  }
  @media (max-width:860px){
    .layout{grid-template-columns:minmax(0,1fr)}
    #toc{position:static}
    iframe#view{height:80vh}
  }
</style>
</head>
<body>
<div class="newver" id="newver" hidden>教學工具箱已更新。<button type="button" id="newverbtn">重新整理，使用新版</button><small>（成績登錄器的資料存在這台瀏覽器裡，不會遺失；測驗格式轉換等工具的畫面內容會清空，需要重新上傳或貼上）</small></div>
<header class="top">
  <h1>教學工具箱</h1>
  <p>課堂管理與備課的小工具。所有計算都在您的瀏覽器中完成，名冊、成績與填寫的內容只存在這台電腦的瀏覽器裡，不會上傳。</p>
</header>

<div class="layout">
  <aside id="toc" aria-label="工具目錄"></aside>
  <div class="work">
    <section id="sechead"><div id="secinfo"></div><div id="toolbar" hidden></div></section>
    <iframe id="view" title="工具"></iframe>
  </div>
</div>
<footer>成績登錄器的資料只存在這台電腦、這個瀏覽器中；換電腦或換瀏覽器不會同步，請以「匯出 CSV」備份。</footer>

<script>
// 側邊目錄：分組 → 項目 → 步驟；每個步驟在右側開啟一個工具頁面
const NAV = [
  { ch: "課堂管理", items: [
    { id: "grades", title: "成績登錄器", desc: "貼上名冊與作答紀錄，依選項給分並合併成一個分數欄，可複製或匯出 CSV。",
      steps: [{ label: "成績登錄器", src: "grades/" }] },
    { id: "aiken", title: "測驗格式轉換", desc: "把選擇題轉成 Moodle 匯入用的 Aiken 或 Moodle XML 格式（XML 可先指定配分），或把填空題轉成 Moodle 克漏字（Cloze）。",
      steps: [{ label: "選擇題（Aiken／XML）", src: "aiken/" },
              { label: "填空題（克漏字）", src: "cloze/",
                note: "貼上填空題文字，逐格填答案與配分，複製結果貼進 Moodle「克漏字」題目的內容欄。" }] },
    { id: "submit", title: "作業繳交後台", desc: "管理各班作業繳交：建立班級、設定作業名稱與說明、產生學生上傳網址。",
      links: [
        { label: "開啟作業繳交後台", href: "https://script.google.com/macros/s/AKfycbzXPWD3kQlTg8wk8ghZWeT_mmwLh3S2llUyhmh2SKTmSWFY794S0AhBkWEyX7xEXZeV/exec?page=admin" },
        { label: "作業檢視（Google Drive）", href: "https://drive.google.com/drive/folders/1TvYphbOlp-JqjF5r1BQRGBCDtVBJOSTe" }],
      steps: [{ label: "作業繳交後台",
        note: "後台會在新分頁開啟。若瀏覽器同時登入多個 Google 帳號而無法登入，請在按鈕上按右鍵，選「在無痕式視窗中開啟連結」。" }] }
  ] },
  { ch: "備課", items: [
    { id: "plan", title: "規劃單元", desc: "把教材切成彼此不重疊的子主題，決定這個單元要寫幾份講義。",
      steps: [{ label: "教學主題菜單", src: "prompt-generator/?embed=1&m=0",
        note: "先把教材上傳到同一個 NotebookLM 筆記本並開新對話；AI 會列出可教的子主題與「講義邊界速查」。" }] },
    { id: "handout", title: "撰寫講義", desc: "依子主題逐份撰寫講義；寫好後若某一段想更深入，再加以深化。",
      steps: [
        { label: "講義生成", src: "prompt-generator/?embed=1&m=1",
          note: "接在「規劃單元」同一個 NotebookLM 對話；貼上講義邊界速查，選一個子主題並調整講義結構。" },
        { label: "深化既有段落", src: "prompt-generator/?embed=1&m=2",
          note: "講義寫好後使用：從講義複製想展開的 ### 區塊，選擇深化方向，產出可直接替換的段落。" }] },
    { id: "latex", title: "公式轉換", desc: "把 NotebookLM 複製下來的公式，轉成 Notion 擴充功能 noeqtion 可一鍵轉換的格式。",
      steps: [{ label: "公式轉換", src: "latex/?embed=1",
        note: "在 NotebookLM 回答下方按「複製」貼到左欄，複製右欄結果貼到 Notion 網頁版，再按 Ctrl+Alt+M。" }] },
    { id: "activity", title: "課堂活動", desc: "依講義內容設計課堂上的小組討論。",
      steps: [{ label: "小組討論題", src: "prompt-generator/?embed=1&m=3",
        note: "接在寫出講義的同一個 NotebookLM 對話，不需要重貼講義。" }] }
  ] }
];
const ITEMS = NAV.flatMap(g => g.items);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let state = { item: "grades", step: {} };
try { Object.assign(state, JSON.parse(localStorage.getItem("toolbox-nav") || "{}")); } catch {}
if (!ITEMS.some(i => i.id === state.item)) state.item = "grades";
const save = () => { try { localStorage.setItem("toolbox-nav", JSON.stringify(state)); } catch {} };

// 按「重新整理，使用新版」後，工具頁網址加上 r=時間，避免 iframe 仍讀到瀏覽器快取的舊版（只在這個分頁有效）
let BUST = ""; try { BUST = sessionStorage.getItem("teach-bust") || ""; } catch {}
const withBust = src => !src || !BUST ? src : src + (src.includes("?") ? "&" : "?") + "r=" + BUST;

const item = () => ITEMS.find(i => i.id === state.item);
const stepIdx = () => Math.min(state.step[state.item] || 0, item().steps.length - 1);

function render() {
  $("toc").innerHTML = NAV.map(g => `<details open><summary>${esc(g.ch)}</summary>` +
    g.items.map(i => `<button data-item="${i.id}" class="${i.id === state.item ? "on" : ""}">${esc(i.title)}</button>`).join("") +
    `</details>`).join("");
  const it = item(), k = stepIdx(), st = it.steps[k];
  $("secinfo").innerHTML = `<h2>${esc(it.title)}</h2><p>${esc(it.desc)}</p>` +
    (it.steps.length > 1 ? `<ol class="steps">${it.steps.map((s, j) =>
      `<li><button data-step="${j}" class="${j === k ? "on" : ""}"><b>${j + 1}</b>${esc(s.label)}</button></li>`).join("")}</ol>` : "") +
    (st.note ? `<p class="stepnote">${esc(st.note)}</p>` : "") +
    (it.links ? `<p class="extlinks">${it.links.map(l =>
      `<a class="extlink" href="${esc(l.href)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join("")}</p>` : "");
  $("view").hidden = !!it.links;
  if (it.links) { clearToolbar(); save(); return; }
  if ($("view").getAttribute("src") !== withBust(st.src)) { clearToolbar(); $("view").setAttribute("src", withBust(st.src)); }
  $("view").title = st.label;
  save();
}

// ---- 工具頁的標題列操作列 ----
// 工具頁送來 {type:"teach:toolbar", label:"已選 {n} / 50 題", strong:"50", buttons:[{id,text}], hidden}，
// 這裡畫在標題列右側並回覆 ack（工具頁收到後就隱藏自己頁內的同一列）；按鈕被按時把 id 傳回工具頁。
function clearToolbar() { $("toolbar").hidden = true; $("toolbar").innerHTML = ""; }
window.addEventListener("message", e => {
  const view = $("view");
  if (!view || e.source !== view.contentWindow) return;
  const d = e.data || {};
  if (d.type !== "teach:toolbar") return;
  e.source.postMessage({ type: "teach:toolbar-ack" }, "*");
  if (d.hidden) { clearToolbar(); return; }
  const lbl = esc(d.label || "").replace("{n}", `<b>${esc(d.strong || "")}</b>`);
  $("toolbar").innerHTML = `<span class="lbl">${lbl}</span>` +
    (d.buttons || []).map(b => `<button type="button" data-tb="${esc(b.id)}">${esc(b.text)}</button>`).join("");
  $("toolbar").hidden = false;
});
$("toolbar").addEventListener("click", e => {
  const b = e.target.closest("button[data-tb]"); if (!b) return;
  $("view").contentWindow.postMessage({ type: "teach:toolbar-click", id: b.dataset.tb }, "*");
});

$("toc").addEventListener("click", e => {
  const b = e.target.closest("button[data-item]"); if (!b) return;
  state.item = b.dataset.item; render();
  if (window.innerWidth < 860) $("sechead").scrollIntoView({ behavior: "smooth" });
});
$("sechead").addEventListener("click", e => {
  const b = e.target.closest("button[data-step]"); if (!b) return;
  state.step[state.item] = +b.dataset.step; render();
});
render();

// 網站更新提示：定期（與切回分頁時）讀取主頁與各工具頁的最新內容，和目前載入的版本比對；不同時顯示提示，按下即載入新版
(() => {
  const pages = [...new Set(["./"].concat(ITEMS.flatMap(i => i.steps.map(s => s.src).filter(Boolean)).map(s => s.split("?")[0])))];
  const loadedUrl = p => p === "./" ? location.pathname + location.search : withBust(p);
  const base = {};
  const get = (url, cache) => fetch(url, { cache }).then(r => r.ok ? r.text() : null).catch(() => null);
  // 基準：瀏覽器目前用的那一份（優先取快取，也就是畫面正在跑的版本）
  Promise.all(pages.map(p => get(loadedUrl(p), "force-cache").then(t => { base[p] = t; })));
  let last = Date.now();
  const check = async () => {
    if (!$("newver").hidden || Date.now() - last < 60000) return; last = Date.now();
    for (const p of pages) {
      if (!base[p]) continue;
      const t = await get(p + "?nv=" + Date.now(), "no-store");
      if (t && t !== base[p]) { $("newver").hidden = false; return; }
    }
  };
  setInterval(check, 5 * 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) check(); });
  window.addEventListener("focus", check);
  $("newverbtn").addEventListener("click", () => {
    const r = String(Date.now());
    try { sessionStorage.setItem("teach-bust", r); } catch {}
    location.href = location.pathname + "?r=" + r;
  });
})();
</script>
</body>
</html>
